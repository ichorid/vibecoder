name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the Pages deploy run the same gate before publishing.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:game
      - run: npm run test:music
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:music-browser
